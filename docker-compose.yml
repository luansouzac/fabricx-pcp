services:
  api:
    build: .
    ports:
      - "5168:8080"
    environment:
      Cors__Origens__0: http://localhost:5173
    volumes:
      - fabricx-data:/data

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: http://localhost:5168
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  fabricx-data:
